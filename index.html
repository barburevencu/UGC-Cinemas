<style>
  :root {
    --bg:#ffffff; --fg:#1c1c1e; --muted:#8a8a8e; --faint:#c4c4c8;
    --line:#ececec; --accent:#c2705a; --accent-text:#c2705a; --maxw:760px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101012; --fg:#ececee; --muted:#86868c; --faint:#48484e;
            --line:#222225; --accent:#e0a07a; --accent-text:#e0a07a; }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-font-smoothing:antialiased; }
  body { background-color:var(--bg); background-image:var(--page-bg-img,none); background-size:5px 5px;
         color:var(--fg); font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .wrap { max-width:var(--maxw); margin:0 auto; padding:0 24px; }
  a { color:inherit; }

  header { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); }
  .bar { display:flex; align-items:baseline; gap:16px; padding:16px 0 0; }
  .logo { font-size:17px; font-weight:600; letter-spacing:-.01em; color:inherit; text-decoration:none; }
  nav { margin-left:auto; display:flex; gap:20px; }
  .tab { cursor:pointer; color:var(--muted); padding-bottom:12px; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; background:none; font:inherit; font-size:13.5px; }
  .tab:hover { color:var(--fg); }
  .tab.active { color:var(--fg); border-bottom-color:var(--accent); }

  .controls { display:flex; flex-direction:column; gap:12px; padding:20px 0 0; }
  .pillbox, .daybox { display:contents; }
  .pills { display:flex; flex-wrap:wrap; gap:8px 16px; }
  .pill { cursor:pointer; background:none; border:0; padding:0; font:inherit; font-size:13px; color:var(--fg); }
  .pill:hover { color:var(--accent-text); }
  .pill.off { color:var(--faint); }
  .pill.all { font-weight:600; margin-right:6px; }
  .pill.all.on { color:var(--accent-text); }
  .dayrow { display:flex; align-items:baseline; gap:8px 16px; flex-wrap:wrap; }
  .days { display:flex; flex-wrap:wrap; align-items:baseline; gap:0 16px; flex:1 1 auto; min-width:0; }
  .day { cursor:pointer; background:none; border:0; padding:5px 0; font:inherit; font-size:13px; color:var(--muted);
         touch-action:none; user-select:none; -webkit-user-select:none; }  /* drag across days on touch */
  .day:hover { color:var(--fg); }
  .day.active { color:var(--accent-text); font-weight:600; }
  .sels { margin-left:auto; display:flex; gap:16px; }
  .dday { font-size:12px; font-weight:600; color:var(--muted); padding:24px 0 8px; border-bottom:1px solid var(--line); }
  .dday.today { color:var(--accent-text); }
  .cday { font-size:12px; font-weight:600; color:var(--muted); padding:12px 0 4px; }
  .cday.today { color:var(--accent-text); }
  .sel { font:inherit; font-size:13px; color:var(--fg); background:var(--bg); border:0; border-bottom:1px solid var(--line); padding:2px 4px 3px 2px; cursor:pointer; }
  .sel:hover { border-bottom-color:var(--faint); }

  main { padding:8px 0 32px; }

  .csec { margin:0; }
  .chead { display:flex; align-items:baseline; gap:8px; padding:24px 0 8px; border-bottom:1px solid var(--line); }
  .cname { font-size:14px; font-weight:600; }
  .caddr { margin-left:auto; color:var(--muted); font-size:12px; white-space:nowrap; }

  .film, .ev { display:flex; gap:16px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); }
  .poster { flex:0 0 auto; width:46px; height:69px; object-fit:cover; border-radius:4px;
            background:var(--line); box-shadow:0 1px 3px rgba(0,0,0,.14);
            transition:transform .12s ease, box-shadow .12s ease; }
  img.poster:hover { transform:scale(1.07); box-shadow:0 4px 12px rgba(0,0,0,.35); }

  /* Poster lightbox: click a thumbnail to see it full size. */
  #lightbox { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center;
              background:rgba(10,8,12,.82); padding:24px; }
  #lightbox.open { display:flex; }
  #lightbox img { max-width:92vw; max-height:88vh; border-radius:6px; box-shadow:0 16px 50px rgba(0,0,0,.55); }
  .ev .poster { width:34px; height:51px; }
  .info { flex:1; min-width:0; padding-top:1px; }
  .ti { font-size:15px; line-height:1.25; }
  .ti a { text-decoration:none; }
  .ti a:hover { color:var(--accent-text); }
  .by { color:var(--muted); font-size:13px; margin-top:1px; }
  /* Showtimes rows: time, title and cinema share the title's baseline; the
     poster centres on the text block (a no-op unless the text outgrows it). */
  .ev { align-items:baseline; }
  /* Cinemas rows: the showtimes share the title's baseline; the poster stays at the top. */
  .film { align-items:baseline; }
  .film .poster { align-self:flex-start; }
  .ev .poster { align-self:center; }
  /* The cinema is a top-right label: its capitals level with the title's
     (1px lines up the two fonts' cap heights), not on its baseline. */
  .ev .cin { align-self:flex-start; margin-top:1px; }
  /* TSPDT 1,000 Greatest Films rank, after the title. Raised 1.4px off the
     baseline so the frame centres on the title's capitals (Archivo 15px). */
  .tspdt { display:inline-block; margin-left:8px; padding:0 4px; border:1px solid currentColor; border-radius:2px;
           color:var(--accent-text); font-size:10px; font-weight:700; line-height:1.45; vertical-align:1.4px;
           white-space:nowrap; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .times { flex:0 0 auto; display:flex; flex-wrap:wrap; gap:4px 12px; justify-content:flex-end; max-width:48%; color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }

  .ev .t { flex:0 0 46px; color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }
  .cin { flex:0 0 auto; color:var(--muted); font-size:12.5px; white-space:nowrap; }
  .cinlink { text-decoration:none; }
  .cinlink:hover { color:var(--accent-text); }

  /* Movies view: one section per film, then its screenings grouped by day. */
  .msec { margin:0; }
  .mhead { display:flex; gap:16px; align-items:flex-start; padding:24px 0 12px; border-bottom:1px solid var(--line); }
  .mhead .poster { width:46px; height:69px; }
  .minfo { flex:1; min-width:0; padding-top:1px; }
  .mtitle { font-size:15px; font-weight:600; line-height:1.25; }
  .mtitle a { text-decoration:none; }
  .mtitle a:hover { color:var(--accent-text); }
  .mby { color:var(--muted); font-size:13px; margin-top:1px; }
  /* Lost in Frenchlation logo: in Showtimes, larger, between the film's lines
     and the cinema name; elsewhere, before the time. */
  .lif { display:inline-block; line-height:0; vertical-align:middle; }
  .lif img { width:24px; height:24px; display:block; }
  /* Midway between the end of the film's lines and the start of the cinema
     name (at least 16px from each), centred on those lines however many
     they wrap to. */
  .info.has-lif { display:flex; align-items:center; gap:16px; }
  .info.has-lif .itext { min-width:0; }
  .info.has-lif .lif { flex:0 0 auto; margin:0 auto; }
  .ev .lif img { width:32px; height:32px; }
  .times .lif, .mtimes .lif { margin-right:8px; }
  .morig { font-style:italic; }
  .mscreen { display:flex; gap:16px; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--line); }
  .mdate { flex:0 0 46px; font-size:13px; font-weight:500; }  /* poster-wide: cinemas line up under the title */
  .mdate.today { color:var(--accent-text); }
  .mcins { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .mcin { display:flex; gap:12px; align-items:baseline; }
  .mcname { flex:1; min-width:0; color:var(--muted); font-size:13px; }
  .mtimes { flex:0 0 auto; display:flex; flex-wrap:wrap; gap:4px 12px; justify-content:flex-end;
            max-width:52%; color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; }

  /* Movies view side index (like iOS Contacts): tap or drag to jump to a
     letter, or to a decade when sorted by year. */
  #mindex { position:fixed; right:2px; top:50%; transform:translateY(-50%); z-index:20;
            display:none; flex-direction:column; align-items:center; padding:6px 3px;
            touch-action:none; user-select:none; -webkit-user-select:none; cursor:pointer; }
  #mindex.on { display:flex; }
  /* With a mouse/trackpad the scrollbar overlays the right edge while
     scrolling; sit clear of it. Touch keeps the index at the edge. */
  @media (pointer:fine) { #mindex { right:16px; } }
  #mindex span { display:block; padding:0 4px; font-size:var(--ifs,10.5px); line-height:1.65;
                 font-weight:600; color:var(--accent-text); font-variant-numeric:tabular-nums; }
  #mindex span.no { color:var(--faint); }
  /* Four-digit decades read denser than single letters at the same pitch. */
  #mindex.dec span { line-height:2.3; }
  .msec { scroll-margin-top:var(--hdr,60px); }
  /* Keep content clear of the strip: --idxw is its measured footprint from the
     viewport's right edge; the centered column's side margin already covers part of it. */
  .wrap.has-idx { padding-right:max(24px, calc(var(--idxw,0px) - max(0px, (100vw - var(--maxw)) / 2))); }

  .empty { color:var(--muted); font-size:13px; padding:16px 0; }
  .note { color:var(--muted); font-size:13.5px; padding:64px 0; text-align:center; }

  footer { border-top:1px solid var(--line); margin-top:12px; }
  .status { color:var(--muted); font-size:12.5px; padding:16px 0 64px; }

  /* Narrow screens: let the header wrap so the tabs and the skin
     switcher never overflow — tabs drop to their own line. */
  @media (max-width:560px) {
    .bar { flex-wrap:wrap; gap:12px 16px; }
    nav { margin-left:0; order:2; width:100%; flex-wrap:wrap; gap:4px 16px; }
    /* Showtimes rows: the cinema drops under the director line instead of
       squeezing the title column (long names like Filmothèque…). */
    .ev { display:grid; grid-template-columns:46px auto minmax(0, 1fr); gap:0 16px; }
    .ev .t, .ev .poster { grid-row:1 / span 2; }
    /* The poster centres vertically in its row's text block. */
    .ev .poster { align-self:center; margin-top:0; }
    .ev .info, .ev .cin { grid-column:3; }
    .ev .cin { white-space:normal; margin-top:1px; }  /* same gap as title to director */
    /* Film lines: just director and year (see movieMetaLine). */
    .ph-hide, .mdet { display:none; }  }

  /* ============================================================
     SKINS — two looks over the shared structure, toggled by
     body[data-skin] via the light switch: Riso (light) / Riso Noir (dark).
     ============================================================ */

  /* ---- Riso Repertory (two-ink ciné-club zine) ---- */
  body[data-skin="riso"] {
    --bg:#f1ece0; --fg:#1b1a17; --muted:#6b665b; --faint:#aaa192;
    --line:#1b1a17; --accent:#ff2e8a; --accent2:#0047ff; color-scheme:light;
    --accent-text:#c8005f;  /* the pink, darkened to 4.9:1 on the paper for small text */
  }
  body[data-skin="riso"] .logo { font-family:"Archivo",system-ui,sans-serif; font-weight:900;
    letter-spacing:-.02em; font-size:19px; text-shadow:1.4px 1.4px 0 #ff2e8a; }
  body[data-skin="riso"] .tab { font-family:"Space Mono",ui-monospace,monospace; font-size:12px;
    text-transform:lowercase; }
  body[data-skin="riso"] .tab.active { color:var(--accent2); border-bottom-color:var(--accent);
    border-bottom-width:3px; }
  body[data-skin="riso"] .pill { border:1.5px solid var(--fg); border-radius:2px; padding:4px 8px;
    font-family:"Space Mono",ui-monospace,monospace; font-size:11px; background:#fff; color:var(--fg); }
  body[data-skin="riso"] .pill.off { color:var(--muted); border-color:var(--faint); background:transparent; }
  body[data-skin="riso"] .pill.all { margin-right:0; }
  body[data-skin="riso"] .pill.all.on { background:var(--accent); color:var(--fg); border-color:var(--accent); }
  body[data-skin="riso"] .pill.daypill.on { background:var(--accent2); color:#fff; border-color:var(--accent2); }
  /* Days matches the Cinemas pill above it: 7 monospace characters + padding + border. */
  body[data-skin] .pill.daypill { min-width:calc(7ch + 19px); }
  body[data-skin="riso"] .pills { gap:8px; }
  body[data-skin="riso"] .day { font-family:"Space Mono",ui-monospace,monospace; font-size:11.5px; }
  body[data-skin="riso"] .day.active { color:var(--accent2); font-weight:700; }
  body[data-skin="riso"] .ti,
  body[data-skin="riso"] .cname,
  body[data-skin="riso"] .mtitle { font-family:"Archivo",system-ui,sans-serif; font-weight:800;
    letter-spacing:-.01em; }
  body[data-skin="riso"] .by,
  body[data-skin="riso"] .mby,
  body[data-skin="riso"] .caddr,
  body[data-skin="riso"] .cin,
  body[data-skin="riso"] .status { font-family:"Space Mono",ui-monospace,monospace; font-size:11.5px; }
  body[data-skin="riso"] .film,
  body[data-skin="riso"] .ev,
  body[data-skin="riso"] .chead,
  body[data-skin="riso"] .mscreen { border-bottom-width:2px; }
  body[data-skin="riso"] .times,
  body[data-skin="riso"] .mtimes,
  body[data-skin="riso"] .ev .t { font-family:"Space Mono",ui-monospace,monospace;
    color:var(--accent2); font-weight:700; }
  body[data-skin="riso"] .poster { background:#0047ff; box-shadow:none; }
  body[data-skin="riso"] .tspdt,
  body[data-skin="risonoir"] .tspdt { font-family:"Space Mono",ui-monospace,monospace; letter-spacing:0; }

  /* ---- 3 · Riso Noir (the two-ink zine on a black ground) ---- */
  body[data-skin="risonoir"] {
    --bg:#15131a; --fg:#ece6d6; --muted:#8f897c; --faint:#565064;
    --line:#4b4654; --accent:#ff2e8a; --accent2:#6a97ff; color-scheme:dark; --accent-text:#ff2e8a;
  }
  body[data-skin="risonoir"] .logo { font-family:"Archivo",system-ui,sans-serif; font-weight:900;
    letter-spacing:-.02em; font-size:19px; text-shadow:1.4px 1.4px 0 #ff2e8a; }
  body[data-skin="risonoir"] .tab { font-family:"Space Mono",ui-monospace,monospace; font-size:12px;
    text-transform:lowercase; }
  body[data-skin="risonoir"] .tab.active { color:var(--accent2); border-bottom-color:var(--accent);
    border-bottom-width:3px; }
  body[data-skin="risonoir"] .pill { border:1.5px solid var(--fg); border-radius:2px; padding:4px 8px;
    font-family:"Space Mono",ui-monospace,monospace; font-size:11px; background:transparent; color:var(--fg); }
  body[data-skin="risonoir"] .pill.off { color:var(--muted); border-color:var(--faint); background:transparent; }
  body[data-skin="risonoir"] .pill.all { margin-right:0; }
  body[data-skin="risonoir"] .pill.all.on { background:var(--accent); color:#15131a; border-color:var(--accent); }
  body[data-skin="risonoir"] .pill.daypill.on { background:var(--accent2); border-color:var(--accent2); }
  body[data-skin="risonoir"] .pills { gap:8px; }
  body[data-skin="risonoir"] .day { font-family:"Space Mono",ui-monospace,monospace; font-size:11.5px; }
  body[data-skin="risonoir"] .day.active { color:var(--accent2); font-weight:700; }
  body[data-skin="risonoir"] .ti,
  body[data-skin="risonoir"] .cname,
  body[data-skin="risonoir"] .mtitle { font-family:"Archivo",system-ui,sans-serif; font-weight:800;
    letter-spacing:-.01em; }
  body[data-skin="risonoir"] .by,
  body[data-skin="risonoir"] .mby,
  body[data-skin="risonoir"] .caddr,
  body[data-skin="risonoir"] .cin,
  body[data-skin="risonoir"] .status { font-family:"Space Mono",ui-monospace,monospace; font-size:11.5px; }
  body[data-skin="risonoir"] .film,
  body[data-skin="risonoir"] .ev,
  body[data-skin="risonoir"] .chead,
  body[data-skin="risonoir"] .mscreen { border-bottom-width:2px; }
  body[data-skin="risonoir"] .times,
  body[data-skin="risonoir"] .mtimes,
  body[data-skin="risonoir"] .ev .t { font-family:"Space Mono",ui-monospace,monospace;
    color:var(--accent2); font-weight:700; }
  body[data-skin="risonoir"] .poster { background:#3a63d6; box-shadow:none; }

  /* Lost in Frenchlation pill: inked in the opposite tone so it stands apart
     from the cinemas; pink while it filters. */
  body[data-skin="riso"] .pill.lifpill { background:#1b1a17; color:#f1ece0; border-color:#1b1a17; }
  body[data-skin="risonoir"] .pill.lifpill { background:#ece6d6; color:#15131a; border-color:#ece6d6; }
  body[data-skin] .pill.lifpill:hover { color:var(--accent-text); }
  /* Ink on the pink (5:1); white on it is only 3.5:1. */
  body[data-skin="riso"] .pill.lifpill.on, body[data-skin="riso"] .pill.lifpill.on:hover { color:#1b1a17; }
  body[data-skin="risonoir"] .pill.lifpill.on, body[data-skin="risonoir"] .pill.lifpill.on:hover { color:#15131a; }
  body[data-skin] .pill.lifpill.on { background:var(--accent); border-color:var(--accent); }

  /* Day labels, the Movies view's dates and cinemas, the side index and
     notes take the skins' mono like every other small label. */
  body[data-skin] .dday, body[data-skin] .cday, body[data-skin] .mdate,
  body[data-skin] #mindex span { font-family:"Space Mono",ui-monospace,monospace; font-weight:700; }
  body[data-skin] .dday, body[data-skin] .cday, body[data-skin] .mdate { font-size:11.5px; }
  body[data-skin] .mcname, body[data-skin] .note,
  body[data-skin] .empty { font-family:"Space Mono",ui-monospace,monospace; font-size:11.5px; }
  /* Small mono labels share one size. */
  body[data-skin] .tab, body[data-skin] .pill { font-size:11.5px; }
  /* A cinema's name heads its section, so it sits above the film titles. */
  body[data-skin] .cname { font-size:17px; }

  /* Time filter ("Any time") takes each skin's type + a matching pill box. */
  body[data-skin="riso"] .sel,
  body[data-skin="risonoir"] .sel { font-family:"Space Mono",ui-monospace,monospace; font-size:11.5px;
    border:0; border-radius:0; padding:5px 2px; background:transparent; color:var(--muted); text-align:right; }
  body[data-skin="riso"] .sel:hover,
  body[data-skin="risonoir"] .sel:hover { color:var(--fg); }
</style>
</head>
<body data-skin="riso">
<h2 class="sr-only">Paris Cinemas showtimes, browsable by cinema, by day, or across the week.</h2>

<header><div class="wrap">
  <div class="bar">
    <a class="logo" href="./">Paris Cinemas</a>
    <nav id="tabs">
      <button class="tab active" data-view="day">Showtimes</button>
      <button class="tab" data-view="movie">Movies</button>
      <button class="tab" data-view="cinema">Cinemas</button>
    </nav>
  </div>
</div></header>

<div class="wrap">
  <div class="controls" id="controls"></div>
</div>

<main><div class="wrap" id="view"><div class="note">Loading…</div></div></main>

<footer><div class="wrap"><div class="status" id="status"></div></div></footer>

<div id="lightbox" aria-hidden="true"><img alt=""></div>
<div id="mindex" role="navigation" aria-label="Jump to"></div>

<script>
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let data = null, inited = false, _dataSig = null;
const initialState = () => ({ view:"day", active:new Set(), minTime:"", daysActive:new Set(), pillsOpen:false, yearBuckets:new Set(), yearOpen:false, movieSort:"title", tspdtOnly:false, lifOnly:false, daysOpen:false });
const state = initialState();
// First-load filters that depend on the data: every cinema, the whole week, every decade.
function resetFilters(){
  state.active = new Set(data.cinemas.map(c => c.name));
  state.daysActive = new Set(data.dates);
  state.yearBuckets = new Set(YEAR_BUCKETS.map(b => b.k));
}

// TSPDT "1,000 Greatest Films": Letterboxd slug -> rank, from tspdt.json
// (snapshotted by fetch_tspdt.py). Stays empty if the file can't be loaded.
let tspdt = new Map(), tspdtEdition = "";

// Movies view sort, picked beside the time filter: [value, label]. "tspdt"
// sorts by list rank and turns the TSPDT filter on.
const SORT_OPTS = [["title", "A–Z"], ["old", "Oldest first"], ["new", "Newest first"], ["tspdt", "TSPDT rank"]];

// Start-time filter options (Showtimes, Movies and Cinemas): [value, label].
const TIME_OPTS = [
  ["", "Any time"], ["12:00", "After 12 pm"], ["14:00", "After 2 pm"],
  ["16:00", "After 4 pm"], ["17:00", "After 5 pm"], ["18:00", "After 6 pm"],
  ["19:00", "After 7 pm"], ["20:00", "After 8 pm"], ["21:00", "After 9 pm"],
];

// Year buckets: a collapsible pill filter (like Cinemas) grouping films by era.
const NOW_YEAR = new Date().getFullYear();
const YEAR_BUCKETS = [
  { k:"new",    label:"New releases",  test:y => y >= NOW_YEAR - 1 },
  { k:"recent", label:"21st century",  test:y => y >= 2000 && y <= NOW_YEAR - 2 },
  { k:"old",    label:"20th century",  test:y => y < 2000 },
];

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function todayStr(){ const d=new Date(); return [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-"); }
function isToday(s){ return s===todayStr(); }
function fmtDay(iso){ const [y,m,d]=iso.split("-").map(Number); const dd=new Date(y,m-1,d); return WD[dd.getDay()]+" "+d; }
function fmtUpdated(iso){ const [y,m,d]=iso.slice(0,10).split("-").map(Number); const dd=new Date(y,m-1,d); return WD[dd.getDay()]+", "+MO[m-1]+" "+d; }
// Film lines (credits in every view, details in Movies and Cinemas). The credits line leads with the original title for
// non-English films when it differs from the English one beyond
// accents/punctuation (AlloCiné's "12 Angry Men" is "Twelve Angry Men").
// Returns HTML: "<i>Xia nü</i> · King Hu · 1971 · Taiwan". Phones keep only
// director and year: the original title and country are .ph-hide spans, each
// carrying its own " · " so no stray separator is left behind.
function movieMetaLine(f){
  const orig = origTitle(f);
  const parts = [[f.director, ""], [f.year, ""], [f.country, "ph-hide"]].filter(([v]) => v);
  const rest = parts.map(([v, cls], i) =>
    `<span${cls ? ` class="${cls}"` : ""}>${i ? " · " : ""}${esc(v)}</span>`).join("");
  const lead = orig ? `<span class="ph-hide"><span class="morig">${esc(orig)}</span>${rest ? " · " : ""}</span>` : "";
  return lead + rest;
}
// "129 min · Drama, History" (two genres at most).
function detailLine(f){
  const genres = (f.genres || "").split(", ").filter(Boolean).slice(0, 2).join(", ");
  return [f.runtime ? f.runtime + " min" : "", genres].filter(Boolean).join(" · ");
}
const foldTitle = s => (s || "").normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
function origTitle(f){ return f.orig && f.lang !== "en" && foldTitle(f.orig) !== foldTitle(f.title) ? f.orig : ""; }
// One day selection, shared by every view.
function curDays(){ return state.daysActive; }
// Year filter: keep films at or below the selected year (unknown years kept).
function yearInBuckets(y){
  if(state.yearBuckets.size === YEAR_BUCKETS.length) return true;  // all buckets = no filter
  const n = parseInt(y, 10);
  if(isNaN(n)) return true;  // unknown year always shown
  return YEAR_BUCKETS.some(b => state.yearBuckets.has(b.k) && b.test(n));
}

function tspdtRank(lb){
  const m = /\/film\/([^/]+)\//.exec(lb || "");
  return m ? tspdt.get(m[1]) : undefined;
}
// TSPDT filter: when on, keep only films on the list.
function inTspdt(lb){ return !state.tspdtOnly || tspdtRank(lb) !== undefined; }
// Rank badges only show while the TSPDT filter is on.
function tspdtBadge(lb){
  const r = state.tspdtOnly ? tspdtRank(lb) : undefined;
  if(r === undefined) return "";
  const t = `#${r} in TSPDT's 1,000 Greatest Films${tspdtEdition ? ", " + tspdtEdition : ""}`;
  return `<span class="tspdt" title="${esc(t)}" aria-label="${esc(t)}">#${r}</span>`;
}

// Lost in Frenchlation screenings (English subtitles): the scraper puts the
// event page in each matching showtime's "LiF" field.
let lifMap = new Map();
const lifKey = (date, cinema, time, title) => [date, cinema, time, title].join("|");
// Each cinema's website (from data.json), linked from its name in every view.
function cinemaLink(name){
  const url = (data.cinemas.find(c => c.name === name) || {}).url;
  return url ? `<a class="cinlink" href="${esc(url)}" target="_blank" rel="noopener">${esc(name)}</a>` : esc(name);
}
// A cinema's address, linked to a Google Maps search for the cinema there.
function addressLink(c){
  if(!c.address) return "";
  const q = encodeURIComponent(`${c.name}, ${c.address} Paris`);
  return `<a class="cinlink" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">${esc(c.address)}</a>`;
}
function indexLif(){
  lifMap = new Map(data.rows.filter(r => r.LiF)
    .map(r => [lifKey(r.date, r.cinema, r.time, r["Movie title"]), r.LiF]));
}
// "Lost in Frenchlation" pill (end of the Cinemas list): only their screenings.
function inLif(r){ return !state.lifOnly || lifMap.has(lifKey(r.date, r.cinema, r.time, r["Movie title"])); }
function lifTag(date, cinema, time, title){
  const url = lifMap.get(lifKey(date, cinema, time, title));
  if(!url) return "";
  const t = "Lost in Frenchlation: English subtitles, drinks before the film";
  return `<a class="lif" href="${esc(url)}" target="_blank" rel="noopener" title="${t}">` +
    `<img src="lif.png" alt="${t}" width="24" height="24"></a>`;
}

function filmsFor(name, date){
  const m = new Map();
  for(const r of data.rows){
    if(r.cinema !== name || r.date !== date) continue;
    if(state.minTime && r.time < state.minTime) continue;
    if(!inLif(r)) continue;
    const k = r["Movie title"] + "|" + r["Year"];
    let f = m.get(k);
    if(!f){ f = {title:r["Movie title"], orig:r["Original title"], director:r["Director"], year:r["Year"], country:r["Country"],
      runtime:r["Runtime"], genres:r["Genres"], lang:r["Language"], lb:r["Letterboxd"], poster:r["Poster"], times:[]}; m.set(k,f); }
    f.times.push(r.time);
  }
  const a = [...m.values()];
  a.forEach(f => f.times = [...new Set(f.times)].sort());
  a.sort((x,y) => (x.times[0]||"").localeCompare(y.times[0]||"") || x.title.localeCompare(y.title));
  return a.filter(f => yearInBuckets(f.year) && inTspdt(f.lb));
}
function titleLink(title, lb){
  return lb ? `<a href="${esc(lb)}" target="_blank" rel="noopener">${esc(title)}</a>` : esc(title);
}
function posterImg(f){
  // No poster (or it fails to load): an empty tile keeps the title column aligned.
  if(!f.poster) return `<span class="poster"></span>`;
  // No loading="lazy": the view's HTML is rebuilt on every filter change, and
  // lazy-created <img>s blank for a frame before repainting cached posters
  // (a flicker). Eager + async decode lets cached thumbnails repaint at once.
  return `<img class="poster" src="${esc(f.poster)}" alt="" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('span'), {className:'poster'}))">`;
}

function renderCinema(){
  const days = data.dates.filter(d => state.daysActive.has(d));
  const multi = days.length > 1;
  let html = "";
  for(const c of data.cinemas){
    if(!state.active.has(c.name)) continue;
    let body = "", any = false;
    for(const date of days){
      const films = filmsFor(c.name, date);
      if(!films.length) continue;
      any = true;
      if(multi) body += `<div class="cday${isToday(date) ? " today" : ""}">${isToday(date) ? "Today" : fmtDay(date)}</div>`;
      for(const f of films){
        body += `<div class="film">${posterImg(f)}<div class="info">
          <div class="ti">${titleLink(f.title, f.lb)}${tspdtBadge(f.lb)}</div>
          ${movieMetaLine(f) ? `<div class="by">${movieMetaLine(f)}</div>` : ""}
          ${detailLine(f) ? `<div class="by mdet">${esc(detailLine(f))}</div>` : ""}
          </div><div class="times">${f.times.map(t => `<span>${lifTag(date, c.name, t, f.title)}${esc(t)}</span>`).join("")}</div></div>`;
      }
    }
    if(state.lifOnly && !any) continue;  // only cinemas hosting their screenings
    html += `<div class="csec"><div class="chead">
      <span class="cname">${cinemaLink(c.name)}</span>
      <span class="caddr">${addressLink(c)}</span></div>`;
    html += any ? body : `<div class="empty">No screenings.</div>`;
    html += `</div>`;
  }
  return html || `<div class="empty">${state.lifOnly ? "No Lost in Frenchlation screenings on these days." : "No cinema selected."}</div>`;
}

function renderDay(){
  const days = data.dates.filter(d => state.daysActive.has(d));
  if(!days.length) return `<div class="empty">No day selected.</div>`;
  const multi = days.length > 1;
  let out = "";
  for(const date of days){
    const rows = [];
    for(const c of data.cinemas){
      if(!state.active.has(c.name)) continue;
      for(const f of filmsFor(c.name, date))
        for(const t of f.times)
          rows.push({time:t, title:f.title, lb:f.lb, poster:f.poster, meta:movieMetaLine(f), cinema:c.name,
            lif:lifTag(date, c.name, t, f.title)});
    }
    const filtered = state.minTime ? rows.filter(r => r.time >= state.minTime) : rows;
    filtered.sort((a,b) => a.time.localeCompare(b.time) || a.title.localeCompare(b.title));
    if(!filtered.length) continue;
    if(multi) out += `<div class="dday${isToday(date) ? " today" : ""}">${isToday(date) ? "Today" : fmtDay(date)}</div>`;
    for(const r of filtered){
      out += `<div class="ev"><div class="t">${esc(r.time)}</div>
        ${posterImg(r)}
        <div class="info${r.lif ? " has-lif" : ""}"><div class="itext"><div class="ti">${titleLink(r.title, r.lb)}${tspdtBadge(r.lb)}</div>${r.meta ? `<div class="by">${r.meta}</div>` : ""}</div>${r.lif}</div>
        <div class="cin">${cinemaLink(r.cinema)}</div></div>`;
    }
  }
  return out || `<div class="empty">No screenings.</div>`;
}

function renderMovies(){
  // Days toggled on (chronological).
  const days = data.dates.filter(d => state.daysActive.has(d));
  // movie key -> {..., byDay: Map(date -> Map(cinema -> Set(times)))}
  const movies = new Map();
  for(const r of data.rows){
    if(!state.active.has(r.cinema)) continue;
    if(!state.daysActive.has(r.date)) continue;
    if(state.minTime && r.time < state.minTime) continue;
    if(!inLif(r)) continue;
    if(!yearInBuckets(r["Year"])) continue;
    if(!inTspdt(r["Letterboxd"])) continue;
    const k = r["Movie title"] + "|" + r["Year"];
    let mv = movies.get(k);
    if(!mv){ mv = {title:r["Movie title"], orig:r["Original title"], director:r["Director"], year:r["Year"], country:r["Country"],
      runtime:r["Runtime"], genres:r["Genres"], lang:r["Language"], lb:r["Letterboxd"], poster:r["Poster"], byDay:new Map()}; movies.set(k, mv); }
    let dm = mv.byDay.get(r.date);
    if(!dm){ dm = new Map(); mv.byDay.set(r.date, dm); }
    let ts = dm.get(r.cinema);
    if(!ts){ ts = new Set(); dm.set(r.cinema, ts); }
    ts.add(r.time);
  }
  if(!movies.size) return `<div class="empty">No screenings.</div>`;
  // Sort, then bucket each film for the side index: first letter (accents
  // folded, non-letters under "#") for A–Z, decade for year sorts, hundreds
  // of ranks ("1" = 1–99, "100" = 100–199, …) for TSPDT.
  const yr = mv => parseInt(mv.year, 10);
  const byTitle = (a,b) => a.title.localeCompare(b.title);
  const list = [...movies.values()];
  const rk = mv => tspdtRank(mv.lb) ?? Infinity;
  if(state.movieSort === "title") list.sort(byTitle);
  else if(state.movieSort === "tspdt") list.sort((a,b) => (rk(a) - rk(b)) || byTitle(a,b));
  else {
    const dir = state.movieSort === "new" ? -1 : 1;
    // Films without a year go last either way.
    list.sort((a,b) => (isNaN(yr(a)) - isNaN(yr(b))) || dir * (yr(a) - yr(b)) || byTitle(a,b));
  }
  const groupOf = mv => {
    if(state.movieSort === "title"){
      const ch = mv.title.normalize("NFD").replace(/[^\p{L}\p{N}]/gu, "").charAt(0).toUpperCase();
      return /[A-Z]/.test(ch) ? ch : "#";
    }
    if(state.movieSort === "tspdt") return rk(mv) === Infinity ? "?" : String(Math.floor(rk(mv) / 100) * 100 || 1);
    return isNaN(yr(mv)) ? "?" : String(Math.floor(yr(mv) / 10) * 10);
  };
  const seen = new Set();
  let h = "";
  for(const mv of list){
    const g = groupOf(mv), first = !seen.has(g);
    seen.add(g);
    h += `<div class="msec"${first ? ` data-ig="${esc(g)}"` : ""}><div class="mhead">${posterImg(mv)}
      <div class="minfo"><div class="mtitle">${titleLink(mv.title, mv.lb)}${tspdtBadge(mv.lb)}</div>
      ${movieMetaLine(mv) ? `<div class="mby">${movieMetaLine(mv)}</div>` : ""}
      ${detailLine(mv) ? `<div class="mby mdet">${esc(detailLine(mv))}</div>` : ""}</div></div>`;
    for(const date of days){
      const dm = mv.byDay.get(date);
      if(!dm) continue;
      const cins = [...dm.keys()].sort((a,b) => a.localeCompare(b));
      let inner = "";
      for(const cn of cins){
        const times = [...dm.get(cn)].sort();
        inner += `<div class="mcin"><span class="mcname">${cinemaLink(cn)}</span>` +
          `<span class="mtimes">${times.map(t => `<span>${lifTag(date, cn, t, mv.title)}${esc(t)}</span>`).join("")}</span></div>`;
      }
      h += `<div class="mscreen"><div class="mdate${isToday(date) ? " today" : ""}">${isToday(date) ? "Today" : fmtDay(date)}</div>` +
        `<div class="mcins">${inner}</div></div>`;
    }
  }
  // Index keys: the full alphabet, or every decade between the oldest and the
  // newest film; keys with no films stay visible but faint.
  let keys;
  if(state.movieSort === "title") keys = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
  else if(state.movieSort === "tspdt"){
    keys = ["1", "100", "200", "300", "400", "500", "600", "700", "800", "900", "1000"];
    if(seen.has("?")) keys.push("?");
  } else {
    const ds = [...seen].filter(g => g !== "?").map(Number);
    keys = [];
    if(ds.length) for(let d = Math.min(...ds); d <= Math.max(...ds); d += 10) keys.push(String(d));
    if(state.movieSort === "new") keys.reverse();
    if(seen.has("?")) keys.push("?");
  }
  _movieIndex = keys.map(k => ({k, has:seen.has(k)}));
  return h;
}

// --- Movies side index: tap or drag along it to jump between groups. ---
let _movieIndex = [];
function renderIndex(){
  const ix = document.getElementById("mindex");
  const on = state.view === "movie" && _movieIndex.some(x => x.has);
  ix.classList.toggle("on", on);
  document.getElementById("view").classList.toggle("has-idx", on);
  if(!on){ ix.innerHTML = ""; return; }
  const sig = state.movieSort + ":" + _movieIndex.map(x => x.k + (x.has ? "+" : "")).join(",");
  if(ix.dataset.sig === sig) return;
  ix.dataset.sig = sig;
  // Shrink labels so the whole strip fits short viewports.
  const dec = state.movieSort !== "title";
  ix.classList.toggle("dec", dec);
  ix.style.setProperty("--ifs", Math.min(10.5, (innerHeight - 170) / _movieIndex.length / (dec ? 2.3 : 1.65)) + "px");
  ix.innerHTML = _movieIndex.map(x => {
    return `<span data-k="${esc(x.k)}"${x.has ? "" : ` class="no"`}>${esc(x.k)}</span>`;
  }).join("");
  document.documentElement.style.setProperty("--idxw",
    Math.ceil(document.documentElement.clientWidth - ix.getBoundingClientRect().left + 8) + "px");
}
(() => {
  const ix = document.getElementById("mindex");
  let active = false, last = null;
  const jump = (y) => {
    const spans = [...ix.querySelectorAll("span")];
    if(!spans.length) return;
    // Pick the label under the pointer's height (clamped to the strip).
    let i = spans.findIndex(sp => y < sp.getBoundingClientRect().bottom);
    if(i < 0) i = spans.length - 1;
    // Empty key: fall through to the next group that has films (else the previous).
    let j = i;
    while(j < _movieIndex.length && !_movieIndex[j].has) j++;
    if(j >= _movieIndex.length){ j = i; while(j >= 0 && !_movieIndex[j].has) j--; }
    if(j < 0) return;
    const tk = _movieIndex[j].k;
    if(tk === last) return;
    last = tk;
    const el = document.querySelector(`.msec[data-ig="${CSS.escape(tk)}"]`);
    if(!el) return;
    document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
    el.scrollIntoView({block:"start"});
  };
  const end = () => {
    active = false; last = null;
  };
  ix.addEventListener("pointerdown", e => {
    active = true; try { ix.setPointerCapture(e.pointerId); } catch(_){} jump(e.clientY); e.preventDefault();
  });
  ix.addEventListener("pointermove", e => { if(active) jump(e.clientY); });
  ix.addEventListener("pointerup", end);
  ix.addEventListener("pointercancel", end);
  addEventListener("resize", () => { document.getElementById("mindex").dataset.sig = ""; if(data) renderIndex(); });
})();

let _pillSig = null, _daySig = null;
function renderControls(){
  const c = document.getElementById("controls");
  const allActive = state.active.size === data.cinemas.length;
  // Two parts, each rebuilt only when what it shows changed: the pill rows,
  // and the day row with the sort/time <select>s. A <select> must never be
  // rebuilt by its own change: Safari crashes ("This webpage was reloaded
  // because a problem occurred") when the menu's element is replaced while it
  // is committing the pick, so the selects' values are set in place instead.
  if(!c.querySelector(".pillbox")) c.innerHTML = `<div class="pillbox"></div><div class="daybox"></div>`;
  const pillBox = c.querySelector(".pillbox"), dayBox = c.querySelector(".daybox");
  const pillSig = [data.cinemas.map(x => x.name).join(","), [...state.active].sort().join(","),
    [...state.yearBuckets].sort().join(","), state.yearOpen, state.pillsOpen,
    state.tspdtOnly, tspdt.size, state.lifOnly, lifMap.size].join("|");
  const daySig = [state.view, data.dates.join(","), [...state.daysActive].sort().join(","), state.daysOpen,
    tspdt.size].join("|");

  // Cinemas and Year are collapsible pink buttons. Year sits beside Cinemas on
  // one row while Cinemas is collapsed (its buckets expand inline there too);
  // once Cinemas is expanded, Year drops to its own row below.
  const allYears = state.yearBuckets.size === YEAR_BUCKETS.length;
  const yearBtn = `<button class="pill all${allYears ? " on" : ""}" data-yall="1">Year</button>` +
    (state.yearOpen ? YEAR_BUCKETS.map(b =>
      `<button class="pill${state.yearBuckets.has(b.k) ? "" : " off"}" data-y="${b.k}">${esc(b.label)}</button>`).join("") : "") +
    // TSPDT toggle rides after Year: pink while it limits the view to list films.
    (tspdt.size ? `<button class="pill all${state.tspdtOnly ? " on" : ""}" data-tspdt="1" aria-pressed="${state.tspdtOnly}"` +
      ` title="Only films in TSPDT's 1,000 Greatest Films, with their rank">TSPDT</button>` : "");
  const cinemaPills = state.pillsOpen ? data.cinemas.map(x =>
    `<button class="pill${state.active.has(x.name) ? "" : " off"}" data-n="${esc(x.name)}">${esc(x.name)}</button>`).join("") +
    (lifMap.size ? `<button class="pill lifpill${state.lifOnly ? " on" : ""}" data-lif="1" aria-pressed="${state.lifOnly}"` +
      ` title="Only Lost in Frenchlation screenings: French films with English subtitles">Lost in Frenchlation</button>` : "") : "";
  let html = `<div class="pills">` +
    `<button class="pill all${allActive ? " on" : ""}" data-all="1">Cinemas</button>` +
    cinemaPills + (state.pillsOpen ? "" : yearBtn) + `</div>`;
  if(state.pillsOpen) html += `<div class="pills">` + yearBtn + `</div>`;
  if(pillSig !== _pillSig){ _pillSig = pillSig; pillBox.innerHTML = html; }
  html = "";
  // One multi-select day row for Cinemas, Showtimes and Movies; Weekly always shows
  // the whole week. The "Any time" filter rides on the right of the same row.
  if(state.view !== "week"){
    const allDays = curDays().size === data.dates.length;
    const dayBtns = data.dates.map(d =>
      `<button class="day${curDays().has(d) ? " active" : ""}" data-d="${esc(d)}">${isToday(d) ? "Today" : fmtDay(d)}</button>`).join("");
    const timeSel = (state.view === "day" || state.view === "movie" || state.view === "cinema")
      ? `<select id="minTime" class="sel" aria-label="Filter by start time">` +
        TIME_OPTS.map(([v,l]) => `<option value="${v}">${l}</option>`).join("") + `</select>`
      : "";
    const sortSel = state.view === "movie"
      ? `<select id="movieSort" class="sel" aria-label="Sort movies">` +
        SORT_OPTS.filter(([v]) => v !== "tspdt" || tspdt.size)
          .map(([v,l]) => `<option value="${v}">${l}</option>`).join("") + `</select>`
      : "";
    // "Days" is a collapsible blue pill like Cinemas: blue while the whole week
    // is shown; it opens the day buttons, and closing them returns to all week.
    const dayPill = `<button class="pill all daypill${allDays ? " on" : ""}" data-dayall="1" aria-expanded="${state.daysOpen}">Days</button>`;
    html += `<div class="dayrow"><div class="days">${dayPill}${state.daysOpen ? dayBtns : ""}</div><div class="sels">${sortSel}${timeSel}</div></div>`;
  }
  if(daySig !== _daySig){ _daySig = daySig; dayBox.innerHTML = html; }
  // Selected values are set in place (see above), never by rebuilding.
  const timeBox = c.querySelector("#minTime"), sortBoxEl = c.querySelector("#movieSort");
  if(timeBox && timeBox.value !== state.minTime) timeBox.value = state.minTime;
  if(sortBoxEl && sortBoxEl.value !== state.movieSort) sortBoxEl.value = state.movieSort;
  const allBtn = c.querySelector("[data-all]");
  if(allBtn) allBtn.onclick = () => {
    state.pillsOpen = !state.pillsOpen;
    // Collapsing tucks the list away and returns to "all cinemas".
    if(!state.pillsOpen){ state.active = new Set(data.cinemas.map(x => x.name)); state.lifOnly = false; }
    renderAll();
  };
  c.querySelectorAll(".pill[data-n]").forEach(b => b.onclick = () => {
    const n = b.dataset.n;
    const total = data.cinemas.length;
    if(state.active.size === total){
      // All active: clicking one isolates it (show only that cinema).
      state.active = new Set([n]);
    } else if(state.active.size === 1 && state.active.has(n)){
      // Only this one active: clicking it deactivates it and activates all the rest.
      state.active = new Set(data.cinemas.map(c => c.name).filter(name => name !== n));
    } else if(state.active.has(n)){
      state.active.delete(n);
    } else {
      state.active.add(n);
    }
    renderAll();
  });
  // Days, the same in every view: the whole week by default; clicking a day
  // shows just that day, and closing the Days pill goes back to the whole week.
  const dayAllBtn = c.querySelector("[data-dayall]");
  if(dayAllBtn) dayAllBtn.onclick = () => {
    state.daysOpen = !state.daysOpen;
    if(!state.daysOpen) state.daysActive = new Set(data.dates);
    renderAll();
  };
  // Clicking, dragging and Cmd/Ctrl-clicking days is handled below (_dayDrag).
  const sel = c.querySelector("#minTime");
  if(sel) sel.onchange = () => { state.minTime = sel.value; renderAll(); };
  const yallBtn = c.querySelector("[data-yall]");
  if(yallBtn) yallBtn.onclick = () => {
    state.yearOpen = !state.yearOpen;
    // Collapsing tucks the buckets away and returns to "all years".
    if(!state.yearOpen) state.yearBuckets = new Set(YEAR_BUCKETS.map(b => b.k));
    renderAll();
  };
  const lifBtn = c.querySelector("[data-lif]");
  if(lifBtn) lifBtn.onclick = () => { state.lifOnly = !state.lifOnly; renderAll(); };
  const tspdtBtn = c.querySelector("[data-tspdt]");
  if(tspdtBtn) tspdtBtn.onclick = () => {
    state.tspdtOnly = !state.tspdtOnly;
    // Rank order means nothing without the list; fall back to A–Z.
    if(!state.tspdtOnly && state.movieSort === "tspdt") state.movieSort = "title";
    renderAll();
  };
  const sortBox = c.querySelector("#movieSort");
  if(sortBox) sortBox.onchange = () => {
    state.movieSort = sortBox.value;
    if(state.movieSort === "tspdt") state.tspdtOnly = true;
    renderAll();
    scrollTo(0, 0);  // land at the top of the new order
  };
  c.querySelectorAll(".pill[data-y]").forEach(b => b.onclick = () => {
    const k = b.dataset.y, total = YEAR_BUCKETS.length;
    if(state.yearBuckets.size === total){
      state.yearBuckets = new Set([k]);
    } else if(state.yearBuckets.size === 1 && state.yearBuckets.has(k)){
      state.yearBuckets = new Set(YEAR_BUCKETS.map(x => x.k).filter(x => x !== k));
    } else if(state.yearBuckets.has(k)){
      state.yearBuckets.delete(k);
    } else {
      state.yearBuckets.add(k);
    }
    renderAll();
  });
}

// --- Day buttons: click picks one day, dragging across days picks that run of
// days (mouse or touch), Cmd/Ctrl-click adds or removes a single day. While
// dragging only the buttons' highlight changes; the view re-renders on release
// (rebuilding the buttons mid-drag would lose the pointer). ---
let _dayDrag = null;
function dayAt(x, y){
  const b = document.elementFromPoint(x, y)?.closest(".day[data-d]");
  return b ? data.dates.indexOf(b.dataset.d) : -1;
}
function dragRange(){
  const [a, b] = [_dayDrag.start, _dayDrag.end].sort((x, y) => x - y);
  return new Set(data.dates.slice(a, b + 1));
}
document.addEventListener("pointerdown", e => {
  const b = e.target.closest?.(".day[data-d]");
  if(!b || e.button !== 0) return;
  e.preventDefault();
  if(e.metaKey || e.ctrlKey){
    const s = new Set(state.daysActive), d = b.dataset.d;
    if(!s.has(d)) s.add(d);
    else if(s.size > 1) s.delete(d);  // never leave no day selected
    state.daysActive = s;
    renderAll();
    return;
  }
  const i = data.dates.indexOf(b.dataset.d);
  _dayDrag = {id:e.pointerId, start:i, end:i};
  document.querySelectorAll(".day[data-d]").forEach(x => x.classList.toggle("active", x === b));
});
document.addEventListener("pointermove", e => {
  if(!_dayDrag || e.pointerId !== _dayDrag.id) return;
  const i = dayAt(e.clientX, e.clientY);
  if(i < 0 || i === _dayDrag.end) return;
  _dayDrag.end = i;
  const r = dragRange();
  document.querySelectorAll(".day[data-d]").forEach(x => x.classList.toggle("active", r.has(x.dataset.d)));
});
document.addEventListener("pointerup", e => {
  if(!_dayDrag || e.pointerId !== _dayDrag.id) return;
  state.daysActive = dragRange();
  _dayDrag = null;
  renderAll();
});
document.addEventListener("pointercancel", () => { if(_dayDrag){ _dayDrag = null; renderAll(); } });
// Keyboard (Enter/Space on a focused day) fires a click with no pointer: pick that day.
document.addEventListener("click", e => {
  const b = e.target.closest?.(".day[data-d]");
  if(!b || e.detail !== 0) return;
  state.daysActive = new Set([b.dataset.d]);
  renderAll();
});

function renderStatus(){
  // Data is refreshed by the scheduled GitHub Action, not from the page, so
  // there's no manual Refresh control or live "refreshing…" state here.
  const s = document.getElementById("status");
  const parts = [];
  if(data.generated_at) parts.push("Updated " + fmtUpdated(data.generated_at));
  if(!data.tmdb) parts.push("no TMDB key");
  s.textContent = parts.join("  ·  ");
}

// The view's HTML is cheap to build (~5ms) but costly to swap in (~1,500
// rows and posters to parse and lay out), so it is only replaced when it
// actually changes, e.g. not when Cinemas or Days merely opens or closes.
let _viewHTML = "";
function setView(html){
  if(html === _viewHTML) return;
  _viewHTML = html;
  document.getElementById("view").innerHTML = html;
}

function renderAll(){
  renderControls();
  renderStatus();
  setView(
    state.view === "cinema" ? renderCinema() :
    state.view === "movie"  ? renderMovies() : renderDay());
  renderIndex();
}

async function loadTspdt(){
  try {
    const t = await (await fetch("tspdt.json")).json();
    tspdt = new Map(t.slugs.map((s, i) => [s, i + 1]));
    tspdtEdition = t.edition || "";
  } catch(e) { return; }  // no list: no badges, no filter button
  if(data && data.rows.length) renderAll();
}

async function load(){
  let r;
  try { r = await fetch("data.json", {cache:"no-store"}); }
  catch(e) { setView(`<div class="note">Could not load data.json.</div>`); return; }
  data = await r.json();
  indexLif();
  if(data.status === "scraping" && !data.rows.length){
    document.getElementById("status").textContent = "updating…";
    setView(`<div class="note">Fetching the latest week… (~30–60s)</div>`);
    setTimeout(load, 1500);
    return;
  }
  if(!inited){
    resetFilters();
    inited = true;
  }
  // Keep day toggles in sync when the window of dates shifts (e.g. the daily
  // refresh drops yesterday and adds a new day).
  const valid = new Set(data.dates);
  for(const d of [...state.daysActive]) if(!valid.has(d)) state.daysActive.delete(d);
  if(!state.daysActive.size) state.daysActive = new Set(data.dates);
  // Only re-render when the fetched data actually changed. During a refresh the
  // same cached rows are served every 1.5s; re-rendering them each time made the
  // view flicker. (User interactions render immediately via their own handlers.)
  const sig = [data.status, data.generated_at, data.rows.length,
    data.dates.join(","), data.cinemas.map(c => c.name).join(",")].join("|");
  if(sig !== _dataSig){
    _dataSig = sig;
    renderAll();
  }
}

document.getElementById("tabs").onclick = (e) => {
  const t = e.target.closest(".tab"); if(!t) return;
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  state.view = t.dataset.view;
  renderAll();
};

// Logo: back to the first-load view without reloading (and re-downloading
// data.json). Modified clicks keep the plain link, e.g. open in a new tab.
document.querySelector(".logo").onclick = (e) => {
  if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0 || !data) return;
  e.preventDefault();
  Object.assign(state, initialState());
  resetFilters();
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.dataset.view === "day"));
  renderAll();
  scrollTo({top:0, behavior:"smooth"});
};

// --- Theme follows the sun in Paris: Riso by day, Riso Noir after sunset. ---
function parisIsDaylight(){
  // Sunrise equation (NOAA): today's sunrise/sunset at Paris as UTC instants.
  const lat = 48.8566, lng = 2.3522, rad = Math.PI / 180, now = Date.now();
  const J = now / 86400000 + 2440587.5;                 // Julian date
  const n = Math.round(J - 2451545.0 + 0.0008);
  const Js = n + lng / 360;                             // mean solar time
  const M = (357.5291 + 0.98560028 * Js) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.0200 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const lam = (M + C + 180 + 102.9372) % 360;
  const Jtransit = 2451545.0 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * lam * rad);
  const decl = Math.asin(Math.sin(lam * rad) * Math.sin(23.44 * rad));
  const cosH = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(decl)) /
               (Math.cos(lat * rad) * Math.cos(decl));
  if(cosH <= -1) return true;    // sun never sets
  if(cosH >= 1) return false;    // sun never rises
  const H = Math.acos(cosH) / rad;
  const toMs = j => (j - 2440587.5) * 86400000;
  const sunrise = toMs(Jtransit - H / 360), sunset = toMs(Jtransit + H / 360);
  return now >= sunrise && now < sunset;
}
function applyAutoSkin(){ document.body.dataset.skin = parisIsDaylight() ? "riso" : "risonoir"; }
applyAutoSkin();
setInterval(applyAutoSkin, 300000);   // re-check every 5 min so it flips at sunset

// --- Poster lightbox: click a poster to view it full size. ---
const _lb = document.getElementById("lightbox"), _lbImg = _lb.querySelector("img");
function closeLightbox(){ _lb.classList.remove("open"); _lb.setAttribute("aria-hidden", "true"); _lbImg.removeAttribute("src"); }
document.getElementById("view").addEventListener("click", (e) => {
  const img = e.target.closest("img.poster"); if(!img) return;
  _lbImg.src = img.currentSrc || img.src;
  _lb.classList.add("open"); _lb.setAttribute("aria-hidden", "false");
});
_lb.addEventListener("click", closeLightbox);
document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeLightbox(); });

loadTspdt();
load();
</script>
